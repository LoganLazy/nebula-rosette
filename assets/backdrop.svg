<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice">
  <!--
    Nebula Rosette 日历背景：玫瑰星云。
    刻意做得很淡 —— 日历首要任务是读日期，背景一旦抢注意力就是负分。
    纯矢量，无外部依赖，打包时会被转成 data URI。
  -->
  <defs>
    <radialGradient id="cloudA" cx="28%" cy="30%" r="46%">
      <stop offset="0%" stop-color="#fb70a4" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#fda4c4" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#fda4c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudB" cx="72%" cy="24%" r="42%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity=".45"/>
      <stop offset="60%" stop-color="#d8b4fe" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudC" cx="50%" cy="82%" r="52%">
      <stop offset="0%" stop-color="#fecdde" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#fecdde" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="46%" cy="44%" r="18%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#fffafc"/>

  <g filter="url(#soften)">
    <rect width="800" height="600" fill="url(#cloudA)"/>
    <rect width="800" height="600" fill="url(#cloudB)"/>
    <rect width="800" height="600" fill="url(#cloudC)"/>
    <ellipse cx="368" cy="264" rx="150" ry="120" fill="url(#core)"/>
  </g>

  <!-- 星点：大小与透明度错开，避免看起来像规则网点 -->
  <g fill="#ffffff">
    <circle cx="96"  cy="88"  r="2.4" opacity=".9"/>
    <circle cx="188" cy="152" r="1.5" opacity=".65"/>
    <circle cx="262" cy="72"  r="1.8" opacity=".75"/>
    <circle cx="344" cy="128" r="1.2" opacity=".55"/>
    <circle cx="430" cy="64"  r="2.1" opacity=".85"/>
    <circle cx="512" cy="140" r="1.4" opacity=".6"/>
    <circle cx="596" cy="92"  r="2.6" opacity=".9"/>
    <circle cx="676" cy="176" r="1.6" opacity=".7"/>
    <circle cx="742" cy="108" r="1.3" opacity=".55"/>
    <circle cx="60"  cy="240" r="1.7" opacity=".7"/>
    <circle cx="148" cy="318" r="1.2" opacity=".5"/>
    <circle cx="238" cy="392" r="2.2" opacity=".8"/>
    <circle cx="322" cy="316" r="1.4" opacity=".6"/>
    <circle cx="452" cy="360" r="1.9" opacity=".75"/>
    <circle cx="540" cy="288" r="1.3" opacity=".55"/>
    <circle cx="628" cy="368" r="2.3" opacity=".85"/>
    <circle cx="716" cy="300" r="1.5" opacity=".65"/>
    <circle cx="104" cy="452" r="2"   opacity=".78"/>
    <circle cx="196" cy="524" r="1.4" opacity=".6"/>
    <circle cx="296" cy="472" r="1.2" opacity=".5"/>
    <circle cx="388" cy="548" r="1.8" opacity=".72"/>
    <circle cx="486" cy="486" r="1.3" opacity=".55"/>
    <circle cx="578" cy="540" r="2.1" opacity=".8"/>
    <circle cx="664" cy="470" r="1.5" opacity=".62"/>
    <circle cx="756" cy="528" r="1.7" opacity=".7"/>
  </g>

  <!-- 两颗稍亮的星带十字光芒 -->
  <g stroke="#ffffff" stroke-linecap="round" opacity=".7">
    <path d="M430 50v28M416 64h28" stroke-width="1.1"/>
    <path d="M596 76v32M580 92h32" stroke-width="1.2"/>
  </g>
</svg>
